<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Turbo Rally · Laurentiu SOICA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="back"><a href="../">← Games</a> · <a href="/">Blog</a></nav>

  <div class="screen" id="screen">
    <canvas id="canvas" width="480" height="270"></canvas>

    <div class="hud" id="hud">
      <div class="hud-top">
        <div class="box time"><span>TIME</span><b id="time">0</b></div>
        <div class="stage-label" id="stage-label"></div>
        <div class="box pos"><span>POS</span><b id="pos">20/20</b></div>
      </div>
      <div class="progress" id="progress"><div class="fill" id="progress-fill"></div></div>
      <div class="hud-bottom">
        <div class="box speed"><b id="speed">0</b><span>KM/H</span></div>
        <div class="box gear"><span>GEAR</span><b id="gear">1</b></div>
        <div class="revs"><div id="revs"></div></div>
        <div class="box score"><span>SCORE</span><b id="score">0</b></div>
      </div>
      <div class="message" id="message"></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- Kept inside .screen so they stay visible in fullscreen. -->
    <div class="touch" id="touch">
      <div class="pad">
        <button data-key="left" aria-label="Steer left">◀</button>
        <button data-key="right" aria-label="Steer right">▶</button>
      </div>
      <div class="pad">
        <button data-key="down">BRAKE</button>
        <button data-key="up" class="gas">GAS</button>
      </div>
    </div>

    <button class="fs-button" id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen (F)"></button>

    <div class="rotate-hint">
      <div class="phone"></div>
      <p>Turn your phone sideways to race</p>
    </div>
  </div>

  <p class="help">
    <kbd>↑</kbd>/<kbd>W</kbd> accelerate · <kbd>↓</kbd>/<kbd>S</kbd> brake ·
    <kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> steer · <kbd>P</kbd> pause · <kbd>M</kbd> sound · <kbd>F</kbd> fullscreen
  </p>

  <script src="game.js"></script>
</body>
</html>
